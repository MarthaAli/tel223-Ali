server {
    listen 80;
    server_name _;

    # La página del cliente web
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # La interfaz: "api" es el nombre del servicio en compose.yaml
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
