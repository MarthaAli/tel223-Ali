services:
  web:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:${DB_CLAVE}@db:5432/laboratorio
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_CLAVE}
      POSTGRES_DB: laboratorio
    volumes:
      - datos:/var/lib/postgresql/data
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./02_datos.sql:/docker-entrypoint-initdb.d/02_datos.sql:ro

volumes:
  datos:
